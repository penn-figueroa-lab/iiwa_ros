#!/usr/bin/env python
# Torque-mode position dither (upstream epfl-lasa/iiwa_ros e293093, PR #89).
# Served at /iiwa_driver/dither. Defaults are the deployed state: OFF.
PACKAGE = "iiwa_driver"

from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, bool_t, double_t

gen = ParameterGenerator()

gen.add("enable",       bool_t,   0, "Dither the commanded position (TORQUE mode only). SmartPad stiffness MUST be 0", False)
gen.add("amplitude",    double_t, 0, "Dither amplitude [rad] (upstream used 0.1)",                                   0.1,  0.0,  0.2)
gen.add("period_s",     double_t, 0, "Dither period [s] (upstream sin(t) = 6.283)",                                  6.283, 0.5, 30.0)
gen.add("ramp_s",       double_t, 0, "Fade-in/fade-out time of the amplitude envelope [s]",                          2.0,  0.1, 10.0)
gen.add("limit_margin", double_t, 0, "Dithered command is clamped this far inside the URDF position limits [rad]",   0.035, 0.0, 0.2)

exit(gen.generate(PACKAGE, "iiwa_driver", "Dither"))
