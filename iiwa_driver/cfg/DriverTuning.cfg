#!/usr/bin/env python
# Live driver knobs: velocity filter and effort-command watchdog. Served at /iiwa_driver/tuning.
# Defaults are the deployed state: velocity_alpha = the former hard-coded 0.2.
PACKAGE = "iiwa_driver"

from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, double_t

gen = ParameterGenerator()

gen.add("velocity_alpha",       double_t, 0, "EMA weight of the NEW finite-difference sample in the joint velocity (1 = unfiltered)", 0.2, 0.05, 1.0)
gen.add("effort_cmd_timeout_s", double_t, 0, "Zero the torque if TorqueController/command is older than this [s]; 0 = off",          0.25, 0.0, 1.0)

exit(gen.generate(PACKAGE, "iiwa_driver", "DriverTuning"))
